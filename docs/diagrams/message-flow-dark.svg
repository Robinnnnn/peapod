<svg aria-labelledby="message-flow-dark-title" aria-describedby="message-flow-dark-desc" xmlns="http://www.w3.org/2000/svg" class="pele pele-block" viewBox="0 0 974 516" width="974" height="516" style="--pele-bg:#0d1117;--pele-fg:#e3ede5;--pele-muted:#a3b3a8;--pele-line:#a1b9a8;--pele-surface:#192a22;--pele-surface-alt:#111c17;--pele-border:#476353;--pele-accent:#90cba1;background:#0d1117;max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_fm:var(--pele-font-mono,monospace);font:16px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,Arial, Helvetica, sans-serif)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="block"><title id="message-flow-dark-title">Peapod encrypted messaging, key synchronization, and notifications</title><desc id="message-flow-dark-desc">Person A and Person B each synchronize a conversation key capsule between their own iPhone and Mac using their own iCloud Keychain. Person A encrypts locally, Firebase relays ciphertext through Firestore and Storage, and Person B decrypts locally. A separate notification path uses Cloud Functions, Firebase Cloud Messaging, and Apple's APNs. iPhone previews are decrypted on device.</desc><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge" data-id="1-AK-A"><path d="M134.35,111L134.35,137" stroke-dasharray="3 4"/><path class="pele-marker" d="M134.35,144L130.99,136L137.71,136Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="1-A-AK"><path d="M157.35,144L157.35,118" stroke-dasharray="3 4"/><path class="pele-marker" d="M157.35,111L160.71,119L153.99,119Z" fill="var(--_l)" stroke="none"/></g><g class=